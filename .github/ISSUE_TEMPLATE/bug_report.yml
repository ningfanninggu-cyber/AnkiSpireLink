name: Bug report
description: Report a problem with Anki Spire Link
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please remove private Anki card contents from logs or screenshots before posting.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the issue.
      placeholder: |
        1. Launch with ...
        2. Start a run as ...
        3. Play ...
        4. Answer Anki with ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS / Windows / Linux
    validations:
      required: true
  - type: input
    id: game-version
    attributes:
      label: Slay the Spire version
      placeholder: "12-18-2022"
  - type: textarea
    id: mods
    attributes:
      label: Mod list
      description: Include ModTheSpire, BaseMod, Anki Spire Link, and any content mods like Downfall.
      placeholder: |
        ModTheSpire:
        BaseMod:
        Anki Spire Link:
        Other mods:
    validations:
      required: true
  - type: textarea
    id: anki
    attributes:
      label: Anki / AnkiConnect status
      description: Can you open http://127.0.0.1:8765 while Anki is running?
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste relevant ModTheSpire logs, with private card contents removed.
